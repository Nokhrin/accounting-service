# compose.dev.yml
services:
  accounting-dev-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:?set DEV_POSTGRES_DB}
      POSTGRES_USER: ${DEV_POSTGRES_USER:?set DEV_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?set DEV_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dev-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 5

  accounting-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://accounting-dev-db:5432/${DEV_POSTGRES_DB}
      DB_USERNAME: ${DEV_POSTGRES_USER}
      DB_PASSWORD: ${DEV_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      accounting-dev-db:
        condition: service_healthy

volumes:
  dev-data: