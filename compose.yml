# docker-compose.yml
services:
  accounting-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://accounting-dev-db:5432/${DEV_DB}
      DB_USERNAME: ${DEV_USER:?set DEV_USER}
      DB_PASSWORD: ${DEV_PASSWORD:?set DEV_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      accounting-dev-db:
        condition: service_healthy

  accounting-prod-db:
    image: postgres:17-alpine
    environment:
      DB: ${PROD_DB:?set PROD_DB}
      USERNAME: ${PROD_USER:?set PROD_USER}
      PASSWORD: ${PROD_PASSWORD:?set PROD_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - accounting-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${USERNAME}\" -d \"$${DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 5

  accounting-dev-db:
    image: postgres:17-alpine
    environment:
      DB: ${DEV_DB:?set DEV_DB}
      USERNAME: ${DEV_USER:?set DEV_USER}
      PASSWORD: ${DEV_PASSWORD:?set DEV_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dev-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${USERNAME}\" -d \"$${DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 5

  accounting-test-db:
    image: postgres:17-alpine
    environment:
      DB: ${LOCAL_DB:?set LOCAL_DB}
      USERNAME: ${LOCAL_USER:?set LOCAL_USER}
      PASSWORD: ${LOCAL_PASSWORD:?set LOCAL_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - test-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${USERNAME}\" -d \"$${DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  accounting-data:
  dev-data:
  test-data:
