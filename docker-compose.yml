services:
  postgres:
    image: postgres:17-alpine
    container_name: accounting-db
    environment:
      POSTGRES_DB: accountingdb
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting
    ports:
      - "5432:5432"
    volumes:
      - accounting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accountingdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - accounting_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: accounting-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@accounting.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - accounting_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: accounting-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accountingdb
      SPRING_DATASOURCE_USERNAME: accounting
      SPRING_DATASOURCE_PASSWORD: accounting
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - accounting_network

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: accounting-jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - accounting_jenkins_home:/var/accounting_jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    networks:
      - accounting_network

volumes:
  accounting_postgres_data:
  accounting_jenkins_home:

networks:
  accounting_network:
    driver: bridge