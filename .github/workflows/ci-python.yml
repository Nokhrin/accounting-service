# .github/workflows/ci-python.yml
name: CI Python - run API tests

on:
  workflow_call:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: tests/accounting-api-tests

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: tests/accounting-api-tests/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip pip-tools
          pip-sync requirements.txt

      - name: Ruff check
        run: ruff check

      - name: Ruff format check
        run: ruff format --check

      - name: Mypy
        run: python -m mypy

      - name: Generate passwords
        working-directory: .
        run: |
          echo "DEV_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "TEST_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start application and dev database
        working-directory: .
        env:
          DEV_DB: ${{ vars.DEV_DB || 'accounting_dev_db' }}
          DEV_USER: ${{ vars.DEV_USER || 'dev' }}
          DEV_PASSWORD: ${{ env.DEV_PASSWORD }}
        run: docker compose -f docker-compose.yml up -d --build accounting-service

      - name: Wait for application health
        working-directory: .
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run pytest
        env:
          TEST_BASE_URL: http://localhost:8080
          TEST_TIMEOUT_SECONDS: "10"
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "5433"
          TEST_DB_NAME: ${{ vars.DEV_DB || 'accounting_dev_db' }}
          TEST_DB_USER: ${{ vars.DEV_USER || 'dev' }}
          TEST_DB_PASSWORD: ${{ env.DEV_PASSWORD }}
        run: python -m pytest -m smoke -v

      - name: Capture Docker logs
        if: always()
        working-directory: .
        env:
          DEV_DB: ${{ vars.DEV_DB || 'accounting_dev_db' }}
          DEV_USER: ${{ vars.DEV_USER || 'dev' }}
          DEV_PASSWORD: ${{ env.DEV_PASSWORD }}
        run: |
          docker compose -f docker-compose.yml logs --no-color > docker.log || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: tests/accounting-api-tests/allure-results
          if-no-files-found: ignore

      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-logs
          path: docker.log
          if-no-files-found: ignore