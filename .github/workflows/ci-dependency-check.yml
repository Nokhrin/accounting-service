# .github/workflows/ci-dependency-check.yml
name: CI Dependency Check - NVD scan

on:
  schedule:
    - cron: '0 6 * * 1'        # monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency_check:
    runs-on: ubuntu-26.04
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Check secret presence
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY secret is not set"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-

      - uses: actions/cache@v6
        with:
          path: ~/.cache/dependency-check
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-
          save-always: true

      - name: Run dependency-check
        run: mvn -B -ntp dependency-check:check

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: ignore