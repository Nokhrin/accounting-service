# .github/workflows/ci-dependency-check.yml
name: CI Dependency Check - NVD scan

on:
  schedule:
    - cron: '0 6 * * 1'        # monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency_check:
    runs-on: ubuntu-26.04
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Check secret presence
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY secret is not set"
            exit 1
          fi

      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-

      - name: Restore NVD cache
        id: nvd-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/dependency-check
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: Run dependency-check
        run: mvn -B -ntp dependency-check:check
        continue-on-error: true

      - name: Save Maven cache
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}

      - name: Save NVD cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/dependency-check
          key: nvd-${{ runner.os }}-${{ github.run_id }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn