openapi: 3.1.0
info:
  title: Accounting Service
  version: 0.0.1

paths:
  /accounts:
    get:
      summary: Get list of accounts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
    post:
      summary: Open new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '201':
          description: Account opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Invalid request

  /accounts/{id}:
    get:
      summary: Get account info
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          description: Account not found

  /accounts/{target_id}/deposit:
    post:
      summary: Deposit funds
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '200':
          description: Deposit succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Invalid amount or inactive account
        '404':
          description: Account not found

  /accounts/{source_id}/withdraw:
    post:
      summary: Withdraw funds
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '200':
          description: Withdrawal succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Invalid amount or insufficient funds
        '404':
          description: Account not found

  /accounts/{source_id}/{target_id}/transfer:
    post:
      summary: Transfer funds
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: target_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '200':
          description: Transfer succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    $ref: '#/components/schemas/Account'
                  target:
                    $ref: '#/components/schemas/Account'
        '400':
          description: Invalid amount or insufficient funds
        '404':
          description: Account not found

components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        balance:
          type: number
        status:
          type: string
          enum: [ACTIVE, BLOCKED, CLOSED]
        holder:
          $ref: '#/components/schemas/AccountHolder'

    AccountHolder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string

    OpenAccountRequest:
      type: object
      required:
        - initialBalance
        - holder
      properties:
        initialBalance:
          type: number
          minimum: 0
        holder:
          $ref: '#/components/schemas/AccountHolder'

    AmountRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          minimum: 0.01