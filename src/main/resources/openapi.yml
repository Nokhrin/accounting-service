openapi: 3.1.0
info:
  title: Accounting Service
  version: 0.0.1

security:
  - basicAuth: [ ]

paths:
  /accounts:
    post:
      operationId: openAccount
      tags: [ accounts ]
      summary: Open new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '201':
          description: AccountResponse opened
          headers:
            Location:
              description: URL of the newly created account
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Validation error (malformed UUID, negative initialBalance, empty displayName)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{accountId}:
    get:
      operationId: getAccount
      tags: [ accounts ]
      summary: Get account
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: AccountResponse not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /accounts/{accountId}/close:
    post:
      operationId: closeAccount
      tags: [ accounts ]
      summary: Close account
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: AccountResponse closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Malformed UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: AccountResponse not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Business rule violation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      code:
                        enum: [ BALANCE_NOT_ZERO, ACCOUNT_NOT_ACTIVE ]

  /accounts/{targetAccountId}/deposit:
    post:
      operationId: deposit
      tags: [ accounts ]
      summary: Deposit funds
      parameters:
        - name: targetAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '200':
          description: Deposit succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositResponse'
        '400':
          description: Validation error (amount < 0.01, malformed UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: AccountResponse not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Business rule violation (inactive account)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      code:
                        enum: [ ACCOUNT_NOT_ACTIVE ]

  /accounts/{sourceAccountId}/withdraw:
    post:
      operationId: withdraw
      tags: [ accounts ]
      summary: Withdraw funds
      parameters:
        - name: sourceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '200':
          description: Withdrawal succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
        '400':
          description: Validation error (amount < 0.01, malformed UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: AccountResponse not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Business rule violation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      code:
                        enum: [ INSUFFICIENT_FUNDS, ACCOUNT_NOT_ACTIVE ]

  /accounts/{sourceAccountId}/{targetAccountId}/transfer:
    post:
      operationId: transfer
      tags: [ accounts ]
      summary: Transfer funds
      parameters:
        - name: sourceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: targetAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '200':
          description: Transfer succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          description: Validation error (amount < 0.01, malformed UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Source or target account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Business rule violation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      code:
                        enum: [ INSUFFICIENT_FUNDS, SOURCE_NOT_ACTIVE, TARGET_NOT_ACTIVE, SAME_ACCOUNT ]
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    ErrorResponse:
      type: object
      required: [ code, message ]
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
        operationId:
          type: string
          format: uuid
          description: Operation identifier for correlation
        details:
          type: array
          items:
            type: string

    AccountHolderRequest:
      type: object
      required: [ displayName ]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200

    AccountHolderResponse:
      type: object
      required: [ id, displayName ]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200

    OpenAccountRequest:
      type: object
      required: [ operationId, initialBalance, holder ]
      properties:
        operationId:
          type: string
          format: uuid
        initialBalance:
          type: number
          minimum: 0
          multipleOf: 0.01
        holder:
          $ref: '#/components/schemas/AccountHolderRequest'

    AmountRequest:
      type: object
      required: [ operationId, amount ]
      properties:
        operationId:
          type: string
          format: uuid
        amount:
          type: number
          minimum: 0.01
          multipleOf: 0.01

    AccountStatus:
      type: string
      enum:
        - ACTIVE
        - BLOCKED
        - CLOSED

    AccountResponse:
      type: object
      required: [ id, balance, status, holder ]
      properties:
        id:
          type: string
          format: uuid
        balance:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 1250.50
          description: Balance in the account's currency
        status:
          $ref: '#/components/schemas/AccountStatus'
        holder:
          $ref: '#/components/schemas/AccountHolderResponse'

    AccountHolder:
      type: object
      required: [ id, displayName ]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string

    DepositResponse:
      type: object
      required: [ operationId, account ]
      properties:
        operationId:
          type: string
          format: uuid
        account:
          $ref: '#/components/schemas/AccountResponse'

    WithdrawalResponse:
      type: object
      required: [ operationId, account ]
      properties:
        operationId:
          type: string
          format: uuid
        account:
          $ref: '#/components/schemas/AccountResponse'

    TransferResponse:
      type: object
      required: [ operationId, sourceAccount, targetAccount ]
      properties:
        operationId:
          type: string
          format: uuid
        sourceAccount:
          $ref: '#/components/schemas/AccountResponse'
        targetAccount:
          $ref: '#/components/schemas/AccountResponse'